<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f4f5f3"/>
<style>
.t{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#263238}.h{font-size:22px;font-weight:750}.s{font-size:14px;fill:#5c6770}.zone{font-size:21px;font-weight:750}.w{stroke:#55afd9;stroke-width:10;stroke-linecap:round}.edge{fill:#e3e8e6;stroke:#34414b;stroke-width:6;stroke-linejoin:round}.door{stroke:#6d8e82;stroke-width:3;fill:none;stroke-dasharray:7 6}.ac{fill:#9bcddd;stroke:#397996;stroke-width:2}
</style>
<text x="45" y="43" class="t h" font-size="28">오드카운티 서재 A/B 공간분리 비교 (개념도)</text>
<text x="45" y="70" class="t s">좌 A = 싱글침대 + 운동 / 우 B = 컴퓨터 작업실 · 좌우 개별 통창 · 시스템에어컨은 B 오른쪽 상부</text>
