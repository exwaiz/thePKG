<rect x="225" y="94" width="14" height="120" rx="3" fill="#445660"/><path d="M233 215 H270" stroke="#a1aeb5" stroke-width="3" stroke-dasharray="4 6"/>
</g></g>
<g transform="translate(610 95)">
