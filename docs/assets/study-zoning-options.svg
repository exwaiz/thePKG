<text x="108" y="145" class="t zone" text-anchor="middle">A</text>
<text x="375" y="145" class="t zone" text-anchor="middle">B</text>
<text x="108" y="163" class="t s" text-anchor="middle">침대 · 운동</text>
<text x="375" y="163" class="t s" text-anchor="middle">책상 · PC</text>
<rect x="39" y="182" width="95" height="42" rx="5" fill="#b4bec8" stroke="#7d8994"/>
<rect x="45" y="187" width="27" height="32" rx="5" fill="#e9eef1"/>
<rect x="333" y="60" width="84" height="30" rx="4" fill="#947e6c" stroke="#655344"/>
<path class="door" d="M235 206 Q235 222 257 222"/>
<text x="514" y="98" class="t s" text-anchor="end">AC</text>
</g>
